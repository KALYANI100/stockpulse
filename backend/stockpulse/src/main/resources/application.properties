spring.config.import=optional:file:.env[.properties]
spring.application.name=stockpulse
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:h2:mem:stockpulse;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.recommendations.demand-spike-multiplier=${DEMAND_SPIKE_MULTIPLIER:3.0}

llm.base-url=${LLM_BASE_URL:https://litellm-qc.zycus.net}
llm.chat-completions-path=${LLM_CHAT_COMPLETIONS_PATH:/v1/chat/completions}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:qwen-cursor}
llm.product-header=${LLM_PRODUCT_HEADER:PC1}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
